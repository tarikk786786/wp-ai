services:
  - type: web
    name: lucky-bot
    env: node
    buildCommand: npm install --legacy-peer-deps
    startCommand: node index.js
    envVars:
      - key: SESSION_ID
        sync: false
      - key: PREFIX
        value: "."
      - key: AUTO_READ_STATUS
        value: "yes"
      - key: AUTO_DOWNLOAD_STATUS
        value: "no"
      - key: PM_PERMIT
        value: "no"
      - key: BOT_NAME
        value: "Tarik-Ai-Wp-Bot"
      - key: PUBLIC_MODE
        value: "no"
      - key: OWNER_NAME
        value: "Tarik"
      - key: OWNER_NUMBER
        value: "923237045919"
