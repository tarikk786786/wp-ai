[build]
  command = "npm install && npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Proxy all /api/* requests to the Render backend
[[redirects]]
  from = "/api/*"
  to = "https://wp-ai-z8v6.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
